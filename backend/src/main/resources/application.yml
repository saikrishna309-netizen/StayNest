server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: staynest-backend

  profiles:
    # Default active profile if none is specified in environment or args
    # Options: dev, prod, test, h2
    active: dev

# Common Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Common Swagger UI / OpenAPI documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method

# StayNest Third-Party Services
staynest:
  sms:
    fast2sms:
      api-key: ${FAST2SMS_API_KEY:qseD4buVIZcIcceLLXOil10MRhiH7BcTfz4pfDrA95x6bHh0zYirXCvs6BYNV8qce04ATbqohB4HZleb}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:ultramsg}
    ultramsg:
      instance-id: ${ULTRAMSG_INSTANCE_ID:instance197383}
      token: ${ULTRAMSG_TOKEN:4kcul3wmcwdoh5d0}
    greenapi:
      id-instance: ${GREENAPI_ID_INSTANCE:}
      api-token-instance: ${GREENAPI_TOKEN_INSTANCE:}
