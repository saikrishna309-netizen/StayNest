server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: staynest-backend

  profiles:
    # Default active profile if none is specified in environment or args
    # Options: dev, prod, test, h2
    active: dev

# Common Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Common Swagger UI / OpenAPI documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
