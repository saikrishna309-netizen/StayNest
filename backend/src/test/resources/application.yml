spring:
  application:
    name: staynest-backend-test
  datasource:
    url: jdbc:h2:mem:staynest_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

staynest:
  jwt:
    secret: "staynestSecureJwtSecretKeyMustBeAtLeast256BitsLongForHS256AlgorithmCompliance!"
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

